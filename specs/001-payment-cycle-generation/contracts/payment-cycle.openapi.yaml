openapi: 3.1.0
info:
  title: SIFAP 2.0 — Payment Cycle API
  version: 1.0.0
  description: |
    Operator API to trigger, monitor, cancel, and resume monthly payment cycles.
    Replaces the legacy BATCHPGT.NSN batch.
servers:
  - url: https://api.sifap.gov.br/v1
    description: Production
  - url: https://api.uat.sifap.gov.br/v1
    description: UAT
security:
  - bearerAuth: []
paths:
  /payment-cycles:
    post:
      operationId: triggerCycle
      summary: Trigger a new payment cycle
      tags: [PaymentCycle]
      security:
        - bearerAuth: [OPR, ADM]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerCycleRequest' }
      responses:
        '202':
          description: Cycle accepted and queued
          headers:
            Location:
              schema: { type: string }
              description: URL of the created cycle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCycle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Conflict — cycle exists or program inactive
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                cycleAlreadyExists:
                  value:
                    type: https://sifap.gov.br/errors/cycle-already-generated
                    title: Cycle already generated
                    status: 409
                    code: CYCLE_ALREADY_GENERATED
                    detail: A cycle for competence 2026-06 and program BFA1 already exists with id=4710.
                programInactive:
                  value:
                    type: https://sifap.gov.br/errors/program-inactive
                    title: Program is inactive
                    status: 409
                    code: PROGRAM_INACTIVE
                    detail: Program BFX9 is not Active and cannot have a cycle.
    get:
      operationId: listCycles
      summary: List cycles with cursor pagination
      tags: [PaymentCycle]
      parameters:
        - in: query
          name: competence
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        - in: query
          name: program
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [Pending, Running, Completed, Aborted, Stale]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentCycleSummary' }
                  nextCursor: { type: string, nullable: true }
  /payment-cycles/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getCycle
      summary: Get cycle details
      tags: [PaymentCycle]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCycle' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payment-cycles/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: cancelCycle
      summary: Cancel a running cycle (ADM only)
      tags: [PaymentCycle]
      security:
        - bearerAuth: [ADM]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5 }
      responses:
        '202': { description: Accepted }
        '409':
          description: Cycle is not in a cancellable state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /payment-cycles/{id}/resume:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: resumeCycle
      summary: Resume a Stale cycle (ADM only)
      tags: [PaymentCycle]
      security:
        - bearerAuth: [ADM]
      responses:
        '202': { description: Accepted }
        '409':
          description: Cycle is not in Stale state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /payment-cycles/{id}/report.csv:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
      - in: query
        name: revealCpf
        schema: { type: boolean, default: false }
        description: 'When true, requires ADM or AUD role and emits an audit event per CPF revealed.'
    get:
      operationId: downloadCycleReport
      summary: Download cycle CSV (CPF masked by default)
      tags: [PaymentCycle]
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string, format: binary }
  /payment-cycles/{id}/failures:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listCycleFailures
      summary: List per-row failures
      tags: [PaymentCycle]
      security:
        - bearerAuth: [OPR, ADM]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CycleFailure' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Token lacks required role
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    TriggerCycleRequest:
      type: object
      required: [competence, programCode]
      properties:
        competence:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: '2026-06'
        programCode:
          type: string
          minLength: 4
          maxLength: 4
          example: 'BFA1'
        forceBackfill:
          type: boolean
          default: false
          description: 'Required for competence older than 12 months. ADM only.'
        backfillReason:
          type: string
          nullable: true
          description: 'Mandatory when forceBackfill = true.'
    PaymentCycle:
      type: object
      properties:
        id: { type: integer, format: int64 }
        competence: { type: string }
        programCode: { type: string }
        status:
          type: string
          enum: [Pending, Running, Completed, Aborted, Stale]
        triggeredBy: { type: string }
        correlationId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        snapshotAt: { type: string, format: date-time, nullable: true }
        generatedCount: { type: integer, format: int64 }
        skippedCount: { type: integer, format: int64 }
        errorCount: { type: integer, format: int64 }
        region99BypassCount: { type: integer, format: int64 }
        totalGrossAmount: { type: number, format: double }
        forceBackfill: { type: boolean }
        backfillReason: { type: string, nullable: true }
    PaymentCycleSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        competence: { type: string }
        programCode: { type: string }
        status: { type: string }
        generatedCount: { type: integer, format: int64 }
        totalGrossAmount: { type: number }
    CycleFailure:
      type: object
      properties:
        id: { type: integer, format: int64 }
        beneficiaryId: { type: integer, format: int64 }
        cpf: { type: string, description: 'Masked: XXX.XXX.XXX-NN' }
        reason: { type: string }
        occurredAt: { type: string, format: date-time }
    Problem:
      type: object
      description: RFC 7807 problem details
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string, format: uuid }
